name: Closed-Loop Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.14.4"

jobs:
  load-and-chaos:
    name: Closed-Loop Load And Chaos
    runs-on: ubuntu-latest
    if: vars.CLOSED_LOOP_NIGHTLY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run load profile
        run: pnpm test:closed-loop:load
        env:
          CLOSED_LOOP_LOAD_CONCURRENCY: "1000"

      - name: Run chaos profile
        run: pnpm test:closed-loop:chaos
