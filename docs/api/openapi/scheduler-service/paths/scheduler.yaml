getDueConcepts:
  get:
    operationId: getDueConcepts
    summary: Get due concepts
    description: |
      Returns due concept schedule states for the authenticated learner. Cards
      are not scheduler inputs; downstream planners use these concepts to build
      Steps and Activities.
    tags: [Scheduler]
    parameters:
      - name: studyMode
        in: query
        required: false
        schema:
          $ref: ../openapi.yaml#/components/schemas/StudyMode
      - name: queue
        in: query
        required: false
        schema:
          $ref: ../openapi.yaml#/components/schemas/SchedulerQueue
      - name: asOf
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
    responses:
      "200":
        description: Due concept schedule states.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/DueConceptsResponse
      "400":
        $ref: ../openapi.yaml#/components/responses/BadRequest
      "401":
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      "403":
        $ref: ../openapi.yaml#/components/responses/Forbidden
      "429":
        $ref: ../openapi.yaml#/components/responses/TooManyRequests
      "500":
        $ref: ../openapi.yaml#/components/responses/InternalServerError

getConceptSchedule:
  get:
    operationId: getConceptSchedule
    summary: Get concept schedule
    description: Returns the scheduler-owned state for one concept and study mode.
    tags: [Scheduler]
    parameters:
      - name: conceptId
        in: path
        required: true
        schema:
          $ref: ../openapi.yaml#/components/schemas/ConceptId
      - name: studyMode
        in: query
        required: true
        schema:
          $ref: ../openapi.yaml#/components/schemas/StudyMode
    responses:
      "200":
        description: Concept schedule state.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ConceptScheduleResponse
      "404":
        description: No schedule exists for this concept.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: "null"
              required: [data]
      "400":
        $ref: ../openapi.yaml#/components/responses/BadRequest
      "401":
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      "403":
        $ref: ../openapi.yaml#/components/responses/Forbidden
      "429":
        $ref: ../openapi.yaml#/components/responses/TooManyRequests
      "500":
        $ref: ../openapi.yaml#/components/responses/InternalServerError

getConceptTransformationHistory:
  get:
    operationId: getConceptTransformationHistory
    summary: Get concept transformation history
    description: |
      Returns recent cognitive transformations recorded for a concept. The
      session planner uses this to avoid identical repetition.
    tags: [Scheduler]
    parameters:
      - name: conceptId
        in: path
        required: true
        schema:
          $ref: ../openapi.yaml#/components/schemas/ConceptId
      - name: studyMode
        in: query
        required: false
        schema:
          $ref: ../openapi.yaml#/components/schemas/StudyMode
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
    responses:
      "200":
        description: Concept transformation history.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/TransformationHistoryResponse
      "400":
        $ref: ../openapi.yaml#/components/responses/BadRequest
      "401":
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      "403":
        $ref: ../openapi.yaml#/components/responses/Forbidden
      "429":
        $ref: ../openapi.yaml#/components/responses/TooManyRequests
      "500":
        $ref: ../openapi.yaml#/components/responses/InternalServerError
