openapi: 3.1.0
info:
  title: Noema Scheduler Service API
  version: 0.1.0
  description: |
    Scheduler Service owns concept-first scheduling state for the realigned
    learning loop. Cards are content payloads only and do not appear in the
    scheduler public API.

    Runtime endpoints are learner-scoped by the authenticated principal.
  contact:
    name: Noema Platform
  license:
    name: Proprietary
servers:
  - url: http://localhost:3004
    description: Local development

tags:
  - name: Scheduler
    description: Concept schedule reads
  - name: Health
    description: Liveness, readiness, metrics, and consumer status

security:
  - bearerAuth: []

paths:
  /health:
    $ref: ./paths/health.yaml#/health
  /health/live:
    $ref: ./paths/health.yaml#/healthLive
  /health/ready:
    $ref: ./paths/health.yaml#/healthReady
  /v1/scheduler/operations/state:
    $ref: ./paths/health.yaml#/operationsState
  /metrics:
    $ref: ./paths/health.yaml#/metrics

  /v1/concepts/due:
    $ref: ./paths/scheduler.yaml#/getDueConcepts
  /v1/concepts/{conceptId}/schedule:
    $ref: ./paths/scheduler.yaml#/getConceptSchedule
  /v1/concepts/{conceptId}/transformation-history:
    $ref: ./paths/scheduler.yaml#/getConceptTransformationHistory

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorInfo:
      $ref: ./components/schemas/common.yaml#/ErrorInfo
    ErrorEnvelope:
      $ref: ./components/schemas/common.yaml#/ErrorEnvelope
    ApiResponseMetadata:
      $ref: ./components/schemas/common.yaml#/ApiResponseMetadata
    BackpressureSignal:
      $ref: ./components/schemas/common.yaml#/BackpressureSignal
    UserId:
      $ref: ./components/schemas/scheduler.yaml#/UserId
    ConceptId:
      $ref: ./components/schemas/scheduler.yaml#/ConceptId
    EvaluationId:
      $ref: ./components/schemas/scheduler.yaml#/EvaluationId
    StepId:
      $ref: ./components/schemas/scheduler.yaml#/StepId
    StudyMode:
      $ref: ./components/schemas/scheduler.yaml#/StudyMode
    SchedulerQueue:
      $ref: ./components/schemas/scheduler.yaml#/SchedulerQueue
    SchedulingAlgorithm:
      $ref: ./components/schemas/scheduler.yaml#/SchedulingAlgorithm
    TransformationType:
      $ref: ./components/schemas/scheduler.yaml#/TransformationType
    ConceptScheduleState:
      $ref: ./components/schemas/scheduler.yaml#/ConceptScheduleState
    ConceptScheduleResponse:
      $ref: ./components/schemas/scheduler.yaml#/ConceptScheduleResponse
    DueConceptsResponse:
      $ref: ./components/schemas/scheduler.yaml#/DueConceptsResponse
    ConceptTransformationHistory:
      $ref: ./components/schemas/scheduler.yaml#/ConceptTransformationHistory
    TransformationHistoryResponse:
      $ref: ./components/schemas/scheduler.yaml#/TransformationHistoryResponse
    HealthStatus:
      $ref: ./components/schemas/common.yaml#/HealthStatus
    HealthCheckEntry:
      $ref: ./components/schemas/common.yaml#/HealthCheckEntry
    HealthResponse:
      $ref: ./components/schemas/common.yaml#/HealthResponse
    HealthLiveResponse:
      $ref: ./components/schemas/common.yaml#/HealthLiveResponse
    HealthReadyResponse:
      $ref: ./components/schemas/common.yaml#/HealthReadyResponse
    SchedulerOperationsStateResponse:
      $ref: ./components/schemas/common.yaml#/SchedulerOperationsStateResponse

  responses:
    BadRequest:
      description: Invalid request payload or semantic validation failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing or invalid authentication token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Principal is authenticated but lacks required scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TooManyRequests:
      description: Principal exceeded quota or throttling policy.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalServerError:
      description: Internal dependency or execution failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
