UserId:
  type: string
  pattern: "^user_[A-Za-z0-9_-]+$|^usr_[A-Za-z0-9_-]+$"
  example: user_123456789012345678901

ConceptId:
  type: string
  pattern: "^concept_[A-Za-z0-9_-]+$"
  example: concept_photosynthesis

EvaluationId:
  type: string
  pattern: "^eval_[A-Za-z0-9_-]+$"
  example: eval_123456789012345678901

StepId:
  type: string
  pattern: "^step_[A-Za-z0-9_-]+$"
  example: step_123456789012345678901

StudyMode:
  type: string
  enum: [language_learning, knowledge_gaining]

SchedulerQueue:
  type: string
  enum: [new_learning, reinforcement, repair]

SchedulingAlgorithm:
  type: string
  enum: [fsrs, hlr, sm2, leitner]

TransformationType:
  type: string
  enum: [recall, explanation, comparison, application, perturbation, error_detection]

ConceptScheduleState:
  type: object
  properties:
    userId:
      $ref: "#/UserId"
    conceptId:
      $ref: "#/ConceptId"
    studyMode:
      $ref: "#/StudyMode"
    algorithm:
      $ref: "#/SchedulingAlgorithm"
    queue:
      $ref: "#/SchedulerQueue"
    dueAt:
      type: string
      format: date-time
    stability:
      type: number
      nullable: true
    difficulty:
      type: number
      nullable: true
    halfLife:
      type: number
      nullable: true
    intervalDays:
      type: number
      minimum: 0
    reviewCount:
      type: integer
      minimum: 0
    lapseCount:
      type: integer
      minimum: 0
    consecutiveCorrect:
      type: integer
      minimum: 0
    lastEvaluationId:
      oneOf:
        - $ref: "#/EvaluationId"
        - type: "null"
    lastStepId:
      oneOf:
        - $ref: "#/StepId"
        - type: "null"
    suspendedUntil:
      type: string
      format: date-time
      nullable: true
    suspendedReason:
      type: string
      nullable: true
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    version:
      type: integer
      minimum: 0
  required:
    - userId
    - conceptId
    - studyMode
    - algorithm
    - queue
    - dueAt
    - stability
    - difficulty
    - halfLife
    - intervalDays
    - reviewCount
    - lapseCount
    - consecutiveCorrect
    - lastEvaluationId
    - lastStepId
    - suspendedUntil
    - suspendedReason
    - createdAt
    - updatedAt
    - version

ConceptScheduleResponse:
  type: object
  properties:
    data:
      $ref: "#/ConceptScheduleState"
  required: [data]

DueConceptsResponse:
  type: object
  properties:
    data:
      type: object
      properties:
        concepts:
          type: array
          items:
            $ref: "#/ConceptScheduleState"
      required: [concepts]
    metadata:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
      required: [count]
  required: [data, metadata]

ConceptTransformationHistory:
  type: object
  properties:
    userId:
      $ref: "#/UserId"
    conceptId:
      $ref: "#/ConceptId"
    studyMode:
      $ref: "#/StudyMode"
    transformation:
      $ref: "#/TransformationType"
    usedAt:
      type: string
      format: date-time
    evaluationId:
      $ref: "#/EvaluationId"
  required: [userId, conceptId, studyMode, transformation, usedAt, evaluationId]

TransformationHistoryResponse:
  type: object
  properties:
    data:
      type: object
      properties:
        history:
          type: array
          items:
            $ref: "#/ConceptTransformationHistory"
      required: [history]
    metadata:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
      required: [count]
  required: [data, metadata]
