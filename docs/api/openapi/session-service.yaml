openapi: 3.1.0
info:
  title: Noema Session Service API
  version: 0.1.0
  description: |
    Step-first session orchestration for Noema's active learning loop.

    The canonical active-session read model is the Step-loop snapshot returned by
    `GET /v1/sessions/{sessionId}/next-step`. Step answering is asynchronous:
    the answer endpoint accepts the learner response locally and durable event
    processing finalizes evaluation afterward.
servers:
  - url: http://localhost:3004
    description: Local development
tags:
  - name: Sessions
  - name: Lesson Plans
  - name: Steps
  - name: Health
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      properties:
        data: {}
        agentHints:
          type: object
          additionalProperties: true
      required: [data, agentHints]
    SessionLifecycleState:
      type: string
      enum: [planning, execution, diagnosis, adaptation, evaluation, completion]
    StepStatus:
      type: string
      enum: [planned, queued, presented, answered, evaluated, skipped, superseded]
    StudyMode:
      type: string
      enum: [language_learning, knowledge_gaining]
    LearningMode:
      type: string
      enum: [exploration, goal_driven, exam_oriented, synthesis]
    Session:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        curriculumId: { type: string }
        curriculumVersionId:
          type: string
          nullable: true
        studyMode:
          $ref: "#/components/schemas/StudyMode"
        learningMode:
          $ref: "#/components/schemas/LearningMode"
        lifecycleState:
          $ref: "#/components/schemas/SessionLifecycleState"
        config:
          type: object
          additionalProperties: true
        stats:
          type: object
          properties:
            stepsPlanned: { type: integer }
            stepsPresented: { type: integer }
            stepsEvaluated: { type: integer }
            stepsSkipped: { type: integer }
          required: [stepsPlanned, stepsPresented, stepsEvaluated, stepsSkipped]
        startedAt:
          type: string
          format: date-time
        lastActivityAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - userId
        - curriculumId
        - studyMode
        - learningMode
        - lifecycleState
        - config
        - stats
        - startedAt
        - lastActivityAt
    LessonPlan:
      type: object
      properties:
        id: { type: string }
        sessionId: { type: string }
        userId: { type: string }
        curriculumId: { type: string }
        curriculumVersionId: { type: string }
        selectedNodeIds:
          type: array
          items: { type: string }
        studyMode:
          $ref: "#/components/schemas/StudyMode"
        learningMode:
          $ref: "#/components/schemas/LearningMode"
        rigorLevel:
          type: string
        topic:
          type: string
        prerequisites:
          type: array
          items: { type: string }
        sourceDecks:
          type: array
          items: { type: string }
        sourceCategories:
          type: array
          items: { type: string }
        assessmentStrategy:
          type: string
          nullable: true
        adaptationRules:
          type: string
          nullable: true
        guardianValidationId:
          type: string
          nullable: true
        state:
          type: string
      required:
        - id
        - sessionId
        - userId
        - curriculumId
        - curriculumVersionId
        - selectedNodeIds
        - studyMode
        - learningMode
        - rigorLevel
        - topic
        - prerequisites
        - sourceDecks
        - sourceCategories
        - state
    LessonPlanGoal:
      type: object
      properties:
        id: { type: string }
        lessonPlanId: { type: string }
        description: { type: string }
        type: { type: string }
        parentGoalId:
          type: string
          nullable: true
        state: { type: string }
        source: { type: string }
        conceptRefs:
          type: array
          items: { type: string }
      required:
        - id
        - lessonPlanId
        - description
        - type
        - state
        - source
        - conceptRefs
    Activity:
      type: object
      properties:
        id: { type: string }
        stepId: { type: string }
        position: { type: integer }
        prompt: { type: string }
        contentSourceType: { type: string }
        renderPayload:
          type: object
          additionalProperties: true
        expectedResponseType: { type: string }
        responseSchema:
          type: object
          additionalProperties: true
      required:
        [
          id,
          stepId,
          position,
          prompt,
          contentSourceType,
          renderPayload,
          expectedResponseType,
          responseSchema,
        ]
    Step:
      type: object
      properties:
        id: { type: string }
        lessonPlanId: { type: string }
        sessionId: { type: string }
        userId: { type: string }
        studyMode:
          $ref: "#/components/schemas/StudyMode"
        position: { type: integer }
        objective: { type: string }
        servesGoalIds:
          type: array
          items: { type: string }
        eligibleModes:
          type: array
          items: { type: string }
        selectedMode:
          type: string
        transformationType:
          type: string
        expectedOutcome:
          type: string
        evaluationType:
          type: string
        difficulty:
          type: number
        isRepair:
          type: boolean
        conceptRefs:
          type: array
          items: { type: string }
        variantSeed:
          type: string
        status:
          $ref: "#/components/schemas/StepStatus"
        evaluationId:
          type: string
          nullable: true
        guardianValidationId:
          type: string
          nullable: true
        presentedAt:
          type: string
          format: date-time
          nullable: true
        answeredAt:
          type: string
          format: date-time
          nullable: true
        evaluatedAt:
          type: string
          format: date-time
          nullable: true
        supersededByStepId:
          type: string
          nullable: true
        activities:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
      required:
        - id
        - lessonPlanId
        - sessionId
        - userId
        - studyMode
        - position
        - objective
        - servesGoalIds
        - eligibleModes
        - selectedMode
        - transformationType
        - expectedOutcome
        - evaluationType
        - difficulty
        - isRepair
        - conceptRefs
        - variantSeed
        - status
    StepLoopSnapshot:
      type: object
      properties:
        session:
          $ref: "#/components/schemas/Session"
        lessonPlan:
          $ref: "#/components/schemas/LessonPlan"
        nextStep:
          anyOf:
            - $ref: "#/components/schemas/Step"
            - type: "null"
      required: [session, lessonPlan, nextStep]
    StartSessionInput:
      type: object
      properties:
        curriculumId: { type: string }
        curriculumVersionId: { type: string }
        studyMode:
          $ref: "#/components/schemas/StudyMode"
        learningMode:
          $ref: "#/components/schemas/LearningMode"
        config:
          type: object
          additionalProperties: true
        topic:
          type: string
        sourceDecks:
          type: array
          items: { type: string }
        sourceCategories:
          type: array
          items: { type: string }
        offlineIntentToken:
          type: string
      required: [curriculumId]
    SessionListResponseData:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        total:
          type: integer
      required: [sessions, total]
    CreateLessonPlanInput:
      type: object
      required: [selectedNodeIds]
      properties:
        curriculumId: { type: string }
        curriculumVersionId: { type: string }
        selectedNodeIds:
          type: array
          minItems: 1
          items:
            type: string
            pattern: "^cnode_[A-Za-z0-9_-]{21}$"
        rigorLevel:
          type: string
        topic:
          type: string
        prerequisites:
          type: array
          items: { type: string }
        sourceDecks:
          type: array
          items: { type: string }
        sourceCategories:
          type: array
          items: { type: string }
        assessmentStrategy:
          type: string
        adaptationRules:
          type: string
        goals:
          type: array
          items:
            $ref: "#/components/schemas/CreateGoalInput"
        steps:
          type: array
          items:
            type: object
            additionalProperties: true
    CreateLessonPlanResult:
      type: object
      properties:
        lessonPlan:
          $ref: "#/components/schemas/LessonPlan"
        goals:
          type: array
          items:
            $ref: "#/components/schemas/LessonPlanGoal"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/Step"
      required: [lessonPlan, goals, steps]
    CreateGoalInput:
      type: object
      properties:
        description: { type: string }
        type: { type: string }
        parentGoalId: { type: string }
        state: { type: string }
        source: { type: string }
        conceptRefs:
          type: array
          items: { type: string }
      required: [description, type]
    AnswerStepInput:
      type: object
      properties:
        response: {}
        correct:
          type: boolean
        selfRating:
          type: string
          enum: [knew_it, hesitated, didnt_know]
        evaluationId:
          type: string
        trace:
          type: object
          properties:
            frames:
              type: object
              properties:
                f0: { $ref: "#/components/schemas/SevenFrameTraceFrame" }
                f1: { $ref: "#/components/schemas/SevenFrameTraceFrame" }
                f2: { $ref: "#/components/schemas/SevenFrameTraceFrame" }
                f3: { $ref: "#/components/schemas/SevenFrameTraceFrame" }
                f4: { $ref: "#/components/schemas/SevenFrameTraceFrame" }
                f5: { $ref: "#/components/schemas/SevenFrameTraceFrame" }
                f6: { $ref: "#/components/schemas/SevenFrameTraceFrame" }
              required: [f0, f1, f2, f3, f4, f5, f6]
          required: [frames]
        responseTimeMs:
          type: number
      required: [correct, selfRating, trace]
    SevenFrameTraceFrame:
      type: object
      properties:
        score:
          type: number
          minimum: 0
          maximum: 1
        notes:
          type: string
      required: [score, notes]
    SkipStepInput:
      type: object
      properties:
        reason:
          type: string
        skippedBy:
          type: string
    CompleteSessionInput:
      type: object
      properties:
        reason:
          type: string
        force:
          type: boolean
    OfflineIntentTokenInput:
      type: object
      properties:
        userId: { type: string }
        sessionBlueprint: {}
        expiresInSeconds: { type: integer }
      required: [userId, sessionBlueprint, expiresInSeconds]
    OfflineIntentVerifyInput:
      type: object
      properties:
        token: { type: string }
      required: [token]
security:
  - bearerAuth: []
paths:
  /v1/sessions:
    post:
      tags: [Sessions]
      summary: Create a session in planning state
      description: |
        A caller must choose a real learner curriculum before creating the
        session. Legacy maintenance fallback curriculum bindings are not part of
        the contract.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartSessionInput"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Session"
    get:
      tags: [Sessions]
      summary: List sessions for the authenticated user
      parameters:
        - name: lifecycleState
          in: query
          schema:
            $ref: "#/components/schemas/SessionLifecycleState"
        - name: learningMode
          in: query
          schema:
            $ref: "#/components/schemas/LearningMode"
        - name: studyMode
          in: query
          schema:
            $ref: "#/components/schemas/StudyMode"
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SessionListResponseData"
  /v1/sessions/{sessionId}:
    get:
      tags: [Sessions]
      summary: Fetch one session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session fetched
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Session"
  /v1/sessions/{sessionId}/lesson-plan:
    post:
      tags: [Lesson Plans]
      summary: Create and activate a lesson plan for a session
      description: |
        The lesson plan must resolve to a real curriculum version through the
        request payload or the session's existing binding. The service does not
        synthesize maintenance version identifiers.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLessonPlanInput"
      responses:
        "201":
          description: Lesson plan created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CreateLessonPlanResult"
  /v1/lesson-plans/{lessonPlanId}/goals:
    post:
      tags: [Lesson Plans]
      summary: Add a goal to a lesson plan
      parameters:
        - name: lessonPlanId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoalInput"
      responses:
        "201":
          description: Goal created
  /v1/sessions/{sessionId}/next-step:
    get:
      tags: [Steps]
      summary: Fetch the canonical Step-loop snapshot for an active session
      description: |
        Returns the active session snapshot `{ session, lessonPlan, nextStep }`.
        `nextStep` may be `null` when the session has no remaining presented or
        pending steps.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Snapshot fetched
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/StepLoopSnapshot"
  /v1/steps/{stepId}/present:
    post:
      tags: [Steps]
      summary: Mark a step presented
      parameters:
        - name: stepId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Step presented
  /v1/steps/{stepId}/answer:
    post:
      tags: [Steps]
      summary: Accept a learner answer and enqueue evaluation
      description: |
        This endpoint is asynchronous. It marks the step `answered`, persists a
        durable `step.answered` event, and returns immediately. Metacognition
        later records the evaluation and session-service finalizes the step to
        `evaluated`.
      parameters:
        - name: stepId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerStepInput"
      responses:
        "200":
          description: Answer accepted; evaluation pending
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Step"
  /v1/steps/{stepId}/skip:
    post:
      tags: [Steps]
      summary: Skip a step
      parameters:
        - name: stepId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkipStepInput"
      responses:
        "200":
          description: Step skipped
  /v1/sessions/{sessionId}/complete:
    post:
      tags: [Sessions]
      summary: Complete a session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteSessionInput"
      responses:
        "200":
          description: Session completed
  /v1/offline-intents:
    post:
      tags: [Sessions]
      summary: Issue an offline intent token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfflineIntentTokenInput"
      responses:
        "201":
          description: Token issued
  /v1/offline-intents/verify:
    post:
      tags: [Sessions]
      summary: Verify an offline intent token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfflineIntentVerifyInput"
      responses:
        "200":
          description: Token verified
  /health:
    get:
      tags: [Health]
      security: []
      summary: Health check
      responses:
        "200":
          description: Healthy
  /health/live:
    get:
      tags: [Health]
      security: []
      summary: Liveness probe
      responses:
        "200":
          description: Alive
  /health/ready:
    get:
      tags: [Health]
      security: []
      summary: Readiness probe
      responses:
        "200":
          description: Ready
